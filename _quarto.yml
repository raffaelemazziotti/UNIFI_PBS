project:
  type: website
  output-dir: docs
  resources:
    - images/shared/ui/home.svg
    - images/shared/ui/search.svg
    - quiz/**
  render:
    - "!Quarto-PyCharm-v5/"
    - "*.qmd"
    - "!old/"

author: "Raffaele M Mazziotti, PhD"
institute: "Scuola di Psicologia, University of Florence"

format:
  revealjs:
    controls: true
    theme: default
    slide-number: true
    logo: images/shared/branding/NEUROFARBA_logo.svg
    css: slide_style.css
    include-after-body: afterbody.html
    transition: fade
    center: true
    math: mathjax
    chalkboard:
      buttons: false
    progress: true
    title-slide-attributes:
      data-background-image: images/shared/branding/NEUROFARBA.svg
      data-background-size: 500px
      data-background-position: "center 10%"
    mermaid:
      theme: neutral
    scroll-view:
      activation-width: 0
