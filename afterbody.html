<script>
(function () {
  function injectHomeLink() {
    const link = document.createElement("a");
    link.href = "index.html";
    link.className = "home-link";
    link.setAttribute("aria-label", "Back to Index");
    link.title = "Back to Index";

    // Positioning
    link.style.position = "absolute";
    link.style.bottom = "20px";
    link.style.left = "50%";
    link.style.transform = "translateX(-50%)";
    link.style.width = "34px";
    link.style.height = "34px";
    link.style.zIndex = "1000";
    link.style.display = "none";
    link.style.opacity = "0.75";
    link.style.cursor = "pointer";

    // Home icon image
    const img = document.createElement("img");
    img.src = "./images/home.svg";
    img.alt = "Home";
    img.width = 34;
    img.height = 34;
    img.style.width = "34px";
    img.style.height = "34px";
    img.style.display = "block";

    link.appendChild(img);
    document.body.appendChild(link);

    // Hover feedback
    link.addEventListener("mouseenter", () => {
      link.style.opacity = "1";
      link.style.transform = "translateX(-50%) scale(2)";
    });

    link.addEventListener("mouseleave", () => {
      link.style.opacity = "0.75";
      link.style.transform = "translateX(-50%) scale(1)";
    });

    // Show only on title slide
    function updateVisibility() {
      const currentSlide = Reveal.getCurrentSlide();
      const isTitleSlide = currentSlide &&
        (currentSlide.id === "title-slide" ||
          currentSlide.classList.contains("title-slide"));

      if (isTitleSlide) {
        link.style.display = "block";
      } else {
        link.style.display = "none";
      }
    }

    updateVisibility();
    Reveal.on("slidechanged", updateVisibility);
    Reveal.on("ready", updateVisibility);
  }

  if (window.Reveal && Reveal.isReady()) {
    injectHomeLink();
  } else {
    document.addEventListener("DOMContentLoaded", function () {
      Reveal.on("ready", injectHomeLink);
    });
  }

  function preparePdfLayout() {
    if (!/[?&](print-pdf|view=print)(?:[=&]|$)/.test(window.location.search)) return;

    function fitSlides() {
      const pages = Array.from(document.querySelectorAll(".pdf-page"));
      if (!pages.length) return;

      const pageHeight = Math.min(...pages.map((page) => page.getBoundingClientRect().height));
      pages.forEach((page) => {
        const slide = page.querySelector("section");
        if (!slide) return;

        // Print the final, complete state of fragments on one physical page.
        page.style.height = `${pageHeight}px`;
        slide.querySelectorAll("img[data-src]").forEach((image) => {
          image.src = image.dataset.src;
        });
        slide.querySelectorAll(".fragment").forEach((fragment) => {
          fragment.classList.add("visible");
          fragment.style.opacity = "1";
          fragment.style.visibility = "visible";
          fragment.style.transform = "none";
        });
        slide.querySelectorAll(".r-stack").forEach((stack) => {
          const states = Array.from(stack.children).filter((child) => child.querySelector("[data-fragment-index]"));
          const finalState = states.at(-1);
          states.forEach((state) => {
            state.style.display = state === finalState ? "" : "none";
          });
        });

        if (slide.id !== "title-slide") slide.style.top = "18px";
        const availableHeight = pageHeight - (parseFloat(slide.style.top) || 0) - 20;
        slide.style.transform = "none";
        slide.style.zoom = "";
        const hasMixedColumnLayout = slide.querySelector(".columns > :not(.column)");
        const scale = slide.id === "title-slide" ? 1 : Math.min(
          hasMixedColumnLayout ? 0.82 : 1,
          availableHeight / slide.scrollHeight
        );
        if (scale < 1) {
          // CSS zoom changes the printable layout itself; transforms can still be clipped by print preview.
          slide.style.zoom = scale;
        }
      });
    }

    const scheduleFit = () => {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        setTimeout(fitSlides, 250);
        setTimeout(fitSlides, 1000);
      }));
    };

    if (window.Reveal && Reveal.isReady()) {
      scheduleFit();
    } else {
      document.addEventListener("DOMContentLoaded", () => Reveal.on("ready", scheduleFit));
    }
    window.addEventListener("load", scheduleFit);
  }

  function addCourseIndexMenuLink() {
    const toolsMenu = document.querySelector(".slide-menu-items");
    if (!toolsMenu) return;

    function createMenuLink(className, href, iconPath, label) {
      const item = document.createElement("li");
      item.className = `slide-tool-item ${className}`;
      const link = document.createElement("a");
      link.href = href;
      const icon = document.createElement("span");
      icon.style.cssText = "display:inline-flex; width:70px; justify-content:center; vertical-align:middle;";
      const image = document.createElement("img");
      image.src = iconPath;
      image.alt = "";
      image.setAttribute("aria-hidden", "true");
      image.style.cssText = "width:22px; height:22px;";
      icon.appendChild(image);
      link.append(icon, document.createTextNode(label));
      item.appendChild(link);
      return item;
    }

    let indexItem = toolsMenu.querySelector(".course-index-menu-link");
    if (!indexItem) {
      indexItem = createMenuLink("course-index-menu-link", "index.html", "images/home.svg", "Course index");
      toolsMenu.prepend(indexItem);
    }

    if (!toolsMenu.querySelector(".course-search-menu-link")) {
      const searchItem = createMenuLink(
        "course-search-menu-link",
        "index.html#/search-course-slides",
        "images/search.svg",
        "Search course slides"
      );
      indexItem.after(searchItem);
    }
  }

  if (window.Reveal && Reveal.isReady()) {
    addCourseIndexMenuLink();
  } else {
    document.addEventListener("DOMContentLoaded", () => Reveal.on("ready", addCourseIndexMenuLink));
  }

  preparePdfLayout();
})();
</script>
