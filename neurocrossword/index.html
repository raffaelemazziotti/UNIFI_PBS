<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
   <link rel="icon" type="image/png" href="cword.png">
  <title>Neuroscience Across Development — Crossword</title>
  <link rel="stylesheet" href="crossword.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="title-group">
        <h1>Neuroscience Across Development</h1>
        <p class="intro">Select a square, then type. Select an intersection again to change direction.</p>
      </div>
      <div class="progress-panel" aria-live="polite">
        <span id="progressText">Completed: 0 / 85</span>
        <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
      </div>
    </header>

    <div class="workspace">
      <section class="grid-panel" aria-label="Crossword grid">
        <div id="gridScroller" class="grid-scroller" tabindex="-1">
          <div id="crosswordGrid" class="crossword-grid" role="grid" aria-label="Neuroscience crossword"></div>
        </div>
      </section>

      <aside class="clue-panel" aria-label="Selected crossword clue">
        <div class="selected-clue">
          <p id="activeNumber" class="active-number">Select a word</p>
          <p id="activeClue" class="active-clue">Select a numbered square to see its clue.</p>
        </div>
        <div class="actions">
          <button id="checkWord" class="primary" type="button" disabled>Check word</button>
          <button id="resetCrossword" type="button">Reset crossword</button>
        </div>
        <p id="statusMessage" class="status" role="status" aria-live="polite"></p>
      </aside>
    </div>
  </main>

  <script src="crossword-data.js"></script>
  <script src="crossword.js"></script>
</body>
</html>
